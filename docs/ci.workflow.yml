# Copy to .github/workflows/ci.yml (the agent sandbox cannot write inside .github).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test:coverage

      - run: yarn build

      - run: yarn workspace @dgbragas/yalatus storybook:build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            packages/yalatus/coverage
            apps/site/coverage
          retention-days: 7

  e2e:
    name: Playwright and axe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - run: yarn workspace @dgbragas/site exec playwright install --with-deps chromium

      - run: yarn build

      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/site/playwright-report
          retention-days: 7
